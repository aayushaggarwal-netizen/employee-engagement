<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Giving — Buddy4Study</title>

  <link rel="stylesheet" href="app/ds-tokens.css" />

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.1"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            border: "hsl(var(--border))",
            "border-soft": "hsl(var(--border-soft))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            surface: { DEFAULT: "hsl(var(--surface))", muted: "hsl(var(--surface-muted))" },
            primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))", hover: "hsl(var(--primary-hover))" },
            secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
            muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
            accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
            card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
            popover: { DEFAULT: "hsl(var(--popover))", foreground: "hsl(var(--popover-foreground))" },
            success: { DEFAULT: "hsl(var(--success))", foreground: "hsl(var(--success-foreground))", soft: "hsl(var(--success-soft))" },
            warning: { DEFAULT: "hsl(var(--warning))", foreground: "hsl(var(--warning-foreground))", soft: "hsl(var(--warning-soft))" },
            destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))", soft: "hsl(var(--destructive-soft))" },
            brand: { yellow: "hsl(var(--brand-yellow))", ink: "hsl(var(--brand-ink))" },
            sidebar: {
              DEFAULT: "hsl(var(--sidebar-background))",
              foreground: "hsl(var(--sidebar-foreground))",
              accent: "hsl(var(--sidebar-accent))",
              border: "hsl(var(--sidebar-border))",
            },
          },
          borderRadius: {
            sm: "calc(var(--radius) - 2px)",
            DEFAULT: "var(--radius)",
            md: "var(--radius-md)",
            lg: "var(--radius-lg)",
            xl: "var(--radius-xl)",
            "2xl": "var(--radius-xl)",
          },
          fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
          boxShadow: {
            xs: "var(--shadow-xs)",
            sm: "var(--shadow-sm)",
            md: "var(--shadow-md)",
            lg: "var(--shadow-lg)",
          },
          maxWidth: { page: "var(--page-max)" },
          keyframes: {
            "fade-in": { "0%": { opacity: 0, transform: "translateY(4px)" }, "100%": { opacity: 1, transform: "translateY(0)" } },
            "scale-in": { "0%": { opacity: 0, transform: "scale(.96)" }, "100%": { opacity: 1, transform: "scale(1)" } },
            "sheet-up": { "0%": { transform: "translateY(100%)" }, "100%": { transform: "translateY(0)" } },
            "ring-pop": { "0%": { transform: "scale(.4)", opacity: 0 }, "60%": { transform: "scale(1.08)", opacity: 1 }, "100%": { transform: "scale(1)", opacity: 1 } },
            "draw-check": { "0%": { "stroke-dashoffset": 48 }, "100%": { "stroke-dashoffset": 0 } },
          },
          animation: {
            "fade-in": "fade-in .25s ease-out both",
            "scale-in": "scale-in .25s ease-out both",
            "sheet-up": "sheet-up .3s cubic-bezier(.32,.72,0,1) both",
            "ring-pop": "ring-pop .5s cubic-bezier(.34,1.4,.64,1) both",
            "draw-check": "draw-check .5s ease-out .25s both",
          },
        },
      },
    };
  </script>

  <style>
    html, body { margin: 0; height: 100%; }
    body { background: hsl(var(--background)); }
    #root { min-height: 100%; }
    /* hide scrollbars on horizontal scrollers but keep function */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* phone frame */
    .phone-shell { box-shadow: var(--shadow-lg), 0 0 0 1px hsl(var(--border)); }
    [contenteditable][data-placeholder]:empty::before { content: attr(data-placeholder); color: hsl(var(--muted-foreground)); pointer-events: none; }

    /* Cohort sizing slider (Create Program · Cohort & budget step) */
    .cohort-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px; border-radius: 999px; outline: none;
      background: linear-gradient(to right,
        hsl(var(--primary)) 0%,
        hsl(var(--primary)) var(--pct, 0%),
        hsl(var(--muted)) var(--pct, 0%),
        hsl(var(--muted)) 100%);
    }
    .cohort-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; border-radius: 999px;
      background: hsl(var(--surface)); border: 2px solid hsl(var(--primary));
      box-shadow: var(--shadow-sm); cursor: pointer;
    }
    .cohort-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 999px;
      background: hsl(var(--surface)); border: 2px solid hsl(var(--primary));
      box-shadow: var(--shadow-sm); cursor: pointer;
    }

    /* ── Mobile-frame layout corrections ──
       Inside the simulated phone the browser window is still desktop-wide, so
       Tailwind's sm:/md:/lg: breakpoints misfire. Re-assert mobile layout here. */
    .eg-mobile .sm\:grid-cols-2 { grid-template-columns: repeat(1, minmax(0,1fr)) !important; }
    .eg-mobile .sm\:grid-cols-4 { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
    .eg-mobile .lg\:grid-cols-\[1\.4fr_1fr\] { grid-template-columns: repeat(1, minmax(0,1fr)) !important; }
    .eg-mobile .sm\:flex-row { flex-direction: column !important; }
    .eg-mobile .sm\:mx-0 { margin-left: -1.25rem !important; margin-right: -1.25rem !important; }
    .eg-mobile .sm\:px-0 { padding-left: 1.25rem !important; padding-right: 1.25rem !important; }
    .eg-mobile .sm\:px-6 { padding-left: 1.25rem !important; padding-right: 1.25rem !important; }
    .eg-mobile .sm\:p-8  { padding: 1.5rem !important; }
    .eg-mobile .sm\:p-10 { padding: 1.75rem !important; }
    .eg-mobile .sm\:py-10 { padding-top: 1.75rem !important; padding-bottom: 1.75rem !important; }
  </style>

  <!-- React + Babel (pinned) -->

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
